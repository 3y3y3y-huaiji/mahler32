name: Lean 4 CI

on:
  push:
    branches: [ main, master, 'trae/**' ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'AGENTS.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secret and layout gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Same script the pre-commit hook runs, over the tracked tree.  Cheap, and
      # it comes first so a leak fails the run before anything is built.
      - name: Refuse credentials and scratch files
        run: python3 scripts/check_no_secrets.py --tree

  build:
    name: Build and Verify
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-connrefused https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean & Lake Toolchain
        run: |
          lean --version
          lake --version

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      # Seal every target that carries the zero-axiom claim, with warnings-as-errors.
      - name: Lean build (all audited targets)
        run: |
          lake build -KwarningAsError=true \
            Mahler32Core Solution SpecCheck SpecCheckConditional

      # `AuditAxioms*.lean` are root modules, not Lake roots; re-elaborate them directly.
      - name: Lean build (audit modules)
        run: |
          lake env lean -D warningAsError=true AuditAxioms.lean
          lake env lean -D warningAsError=true AuditAxiomsConditional.lean

      # Palomar builds these two targets by name.  `Challenge` is expected to log its `sorry`
      # warnings; only a non-zero exit code is a failure here.
      - name: Palomar targets
        run: |
          lake build Solution
          lake build Challenge

      - name: Conditional target (task 11)
        run: lake build Mahler32Conditional

      # Source-level gate: no core module may contain `sorry`/`admit`/`native_decide`, may not
      # declare an `axiom`, and the conditional axiom may not leak into the zero-axiom core.
      # Comments are stripped first, so prose like "no `sorry`" does not trip the gate.
      - name: Core source gate (no sorry/admit/native_decide/axiom)
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          def strip_comments(s: str) -> str:
              s = re.sub(r"/-.*?-/", "", s, flags=re.S)   # block / doc comments
              s = re.sub(r"--[^\n]*", "", s)              # line comments
              return s

          core = sorted(pathlib.Path("Mahler32").glob("*.lean")) + [
              pathlib.Path("Mahler32Core.lean")
          ]
          bad = False
          for f in core:
              text = strip_comments(f.read_text())
              for kw in ("sorry", "admit", "native_decide"):
                  for m in re.finditer(r"\b" + kw + r"\b", text):
                      line = text[: m.start()].count("\n") + 1
                      print(f"::error file={f},line={line}::forbidden `{kw}` in core module")
                      bad = True
              if re.search(r"^\s*(private\s+|protected\s+|noncomputable\s+)*axiom\b", text, re.M):
                  print(f"::error file={f}::core modules must not declare axioms")
                  bad = True

          leak_scan = core + [pathlib.Path("Solution.lean")]
          for f in leak_scan:
              if "schlickewei_subspace_Q3" in f.read_text():
                  print(f"::error file={f}::the conditional axiom leaked into the zero-axiom core")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      # Compile *every* module by name, not just `Basic.lean`, with warnings-as-errors.
      # `lake env lean` re-elaborates the source, so a `sorry` shows up as a warning
      # (hence an error) even if a stale `.olean` was already sitting in `.lake`.
      - name: Strict Verification of All Modules
        run: |
          set -uo pipefail
          status=0
          for f in Mahler32Core.lean Mahler32.lean AuditAxioms.lean AuditAxiomsConditional.lean \
                   Mahler32/*.lean Mahler32Conditional/*.lean; do
            echo "::group::lake env lean -D warningAsError=true $f"
            lake env lean -D warningAsError=true "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

      # One `#lint` over the whole zero-axiom core instead of a single-file lint.
      - name: Mathlib Linter Check (#lint over the whole core)
        run: |
          set -euo pipefail
          LINT_FILE=$(mktemp --suffix=.lean)
          printf 'import Mahler32Core\n\n#lint\n' > "$LINT_FILE"
          lake env lean "$LINT_FILE"
          rm -f "$LINT_FILE"

      # The zero-axiom audit: every main theorem of tasks 1–10 must depend only on the Lean
      # standard triple.  `check_axioms.py` also rejects `sorryAx` and parses every line.
      - name: Kernel Axioms Verification (zero-axiom core)
        run: |
          python3 scripts/check_axioms.py AuditAxioms.lean propext,Quot.sound,Classical.choice

      # The conditional audit: exactly one extra axiom is allowed, and only here.
      - name: Kernel Axioms Verification (conditional task 11)
        run: |
          python3 scripts/check_axioms.py \
            AuditAxiomsConditional.lean \
            propext,Quot.sound,Classical.choice,Mahler32Conditional.schlickewei_subspace_Q3

      # Certificates must be exact, self-consistent and reproducible.  `--verify` asserts every
      # finite claim; the second run + diff rules out non-deterministic output drifting from the
      # committed sources.
      - name: Exact rational certificates (verify + reproducibility)
        run: |
          set -euo pipefail
          python3 scripts/generate_certificates.py --verify
          python3 scripts/generate_certificates.py > /tmp/cert-a.txt
          python3 scripts/generate_certificates.py > /tmp/cert-b.txt
          diff -u /tmp/cert-a.txt /tmp/cert-b.txt

      # SpecCheck: definition / statement / value lock.  Neither file is a default target, so CI
      # compiles them explicitly with warnings-as-errors.
      - name: SpecCheck (definition, statement and value lock)
        run: |
          set -euo pipefail
          lake env lean -D warningAsError=true SpecCheck.lean
          lake env lean -D warningAsError=true SpecCheckConditional.lean

      # Independent kernel replay via the standalone `leanchecker` shipped with the toolchain.
      - name: Kernel replay (leanchecker)
        run: |
          set -euo pipefail
          for m in \
            Mahler32.Base6LightCone Mahler32.SyracuseGates \
            Mahler32.ArnoldTongue5State Mahler32.ArnoldTongue7State \
            Mahler32.DAGBoundedGap Mahler32.QuiverMonotone \
            Mahler32.TwoWorldPadeCriterion \
            Mahler32.Fib11Free Mahler32.WalshZeroCorr \
            Mahler32.HInvariance Mahler32.SyracuseBijection \
            Mahler32.Basic Mahler32Core \
            Mahler32Conditional.AlgebraicPairBranch; do
            echo "::group::leanchecker $m"
            lake env leanchecker "$m"
            echo "::endgroup::"
          done
