name: Lean 4 CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'AGENTS.md'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'AGENTS.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secret and layout gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Same script the pre-commit hook runs, over the tracked tree.  Cheap, and
      # it comes first so a leak fails the run before anything is built.
      - name: Refuse credentials and scratch files
        run: python3 scripts/check_no_secrets.py --tree

  build:
    name: Build and Verify
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl -sSfL --retry 5 --retry-connrefused https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean & Lake Toolchain
        run: |
          lean --version
          lake --version

      - name: Fetch Mathlib Cache
        run: lake exe cache get

      - name: Lake Build
        run: lake build -KwarningAsError=true

      # Palomar builds these two targets by name.  `Challenge` is expected to log its `sorry`
      # warnings; only a non-zero exit code is a failure here.
      - name: Palomar targets
        run: |
          lake build Solution
          lake build Challenge

      - name: Strict Verification of All Modules
        run: |
          lake env lean -D warningAsError=true Mahler32.lean
          lake env lean -D warningAsError=true Mahler32/Basic.lean

      - name: Mathlib Linter Check (#lint)
        run: |
          cat << 'LEAN' > run_linter.lean
          import Mahler32.Basic

          #lint
          LEAN
          lake env lean run_linter.lean
          rm run_linter.lean

      - name: Kernel Axioms Verification
        run: |
          cat << 'LEAN' > check_axioms.lean
          import Mahler32.Basic

          open Mahler32

          #print axioms step_parity
          #print axioms step_parity_hex
          #print axioms a_mod_six
          #print axioms parity_window_hex
          #print axioms cliff_sharp
          #print axioms ternary_machine
          #print axioms run_spec
          #print axioms step_pow_bstep
          #print axioms period_doubling
          #print axioms step_pow_two_pow
          #print axioms good_step_pow
          #print axioms good_card
          #print axioms step_pow_add_six_pow
          #print axioms light_cone_flip_hex
          #print axioms parity_linear_split
          #print axioms bstep_mod_three_pow
          #print axioms good_mod_iff
          #print axioms good11Free_card
          #print axioms walsh_zero_of_bit_zero
          #print axioms walsh_eq_two_mul_core
          LEAN
          OUTPUT=$(lake env lean check_axioms.lean)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "sorryAx"; then
            echo "Error: proof depends on sorryAx"
            exit 1
          fi
          for T in step_parity step_parity_hex a_mod_six parity_window_hex cliff_sharp \
                   ternary_machine step_pow_bstep period_doubling step_pow_two_pow \
                   good_step_pow good_card step_pow_add_six_pow light_cone_flip_hex \
                   parity_linear_split bstep_mod_three_pow good_mod_iff good11Free_card \
                   walsh_zero_of_bit_zero walsh_eq_two_mul_core; do
            if ! echo "$OUTPUT" | grep -Fq "'Mahler32.$T' depends on axioms: [propext, Classical.choice, Quot.sound]" \
               && ! echo "$OUTPUT" | grep -Fq "'Mahler32.$T' depends on axioms: [propext, Quot.sound]" \
               && ! echo "$OUTPUT" | grep -Fq "'Mahler32.$T' does not depend on any axioms"; then
              echo "Error: unexpected axioms for $T"
              exit 1
            fi
          done
          echo "All kernel axioms verified successfully!"
