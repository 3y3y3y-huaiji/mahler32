name: Papers (LaTeX)

# Compiles both companion papers on every push / PR, uploads the PDFs as workflow artifacts,
# and — when a `v*` tag is pushed — attaches the PDFs plus a SHA-256 checksum file to a GitHub
# Release.

on:
  push:
    branches: [ main, master, 'trae/**' ]
    tags: [ 'v*' ]
    paths:
      - 'papers/**'
      - '.github/workflows/papers.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'papers/**'
      - '.github/workflows/papers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - paper1_transcendence
          - paper2_zero_entropy_fluid
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install TeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended

      - name: Compile main.tex
        working-directory: papers/${{ matrix.paper }}
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ls -lh main.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-${{ matrix.paper }}
          path: papers/${{ matrix.paper }}/main.pdf
          if-no-files-found: error

  release:
    name: Release PDFs
    needs: build-pdf
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: pdf-*
          # Keep each artifact in its own directory; both are named `main.pdf`.
          path: artifacts

      - name: Assemble PDFs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/pdf-paper1_transcendence/main.pdf dist/paper1_transcendence.pdf
          cp artifacts/pdf-paper2_zero_entropy_fluid/main.pdf dist/paper2_zero_entropy_fluid.pdf
          ( cd dist && sha256sum ./*.pdf > SHA256SUMS.txt )
          ls -lh dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/paper1_transcendence.pdf \
            dist/paper2_zero_entropy_fluid.pdf \
            dist/SHA256SUMS.txt
