name: Papers (LaTeX)

# Compiles the unified paper on every push / PR, uploads the PDF as a workflow artifact,
# and — when a `v*` tag is pushed — attaches the PDF plus a SHA-256 checksum file to a GitHub
# Release.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - 'papers/**'
      - 'scripts/check_latex.py'
      - 'scripts/verify_refs.py'
      - '.github/workflows/papers.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'papers/**'
      - 'scripts/check_latex.py'
      - 'scripts/verify_refs.py'
      - '.github/workflows/papers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build ${{ matrix.paper }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paper:
          - main
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TeX toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk lmodern texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-bibtex-extra texlive-fonts-recommended

      - name: Check LaTeX & BibTeX sources
        run: |
          python3 scripts/check_latex.py --source
          python3 scripts/verify_refs.py --offline

      - name: Compile main.tex and check build logs
        working-directory: papers/${{ matrix.paper }}
        run: |
          set -euo pipefail
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          ls -lh main.pdf
          python3 ../../scripts/check_latex.py --source --build .

      - name: Upload PDF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-${{ matrix.paper }}
          path: papers/${{ matrix.paper }}/main.pdf
          if-no-files-found: error

  release:
    name: Release PDFs
    needs: build-pdf
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download PDF artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdf-main
          path: artifacts

      - name: Assemble PDF and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/main.pdf dist/main.pdf
          ( cd dist && sha256sum ./*.pdf > SHA256SUMS.txt )
          ls -lh dist

      # The release may already exist when the tag was published by hand before
      # this workflow ran.  In that case upload the PDFs (overwriting any asset
      # of the same name) instead of failing on `gh release create`.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            dist/main.pdf
            dist/SHA256SUMS.txt
          )
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${assets[@]}"
          fi
