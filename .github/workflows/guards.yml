name: Secret and layout gate

on:
  push:
    branches: [ main, master, 'trae/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secret and layout gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Refuse credentials and scratch files
        run: python3 scripts/check_no_secrets.py --tree

      # This workflow has no `paths-ignore`, so it also covers documentation-only
      # changes (README/AGENTS/docs) that `lean_build.yml` skips.  The SSOT gate is
      # cheap and needs no Lean toolchain.
      - name: SSOT gate
        run: python3 scripts/verify_ssot.py
