name: Secret and layout gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Secret and layout gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse credentials and scratch files
        run: python3 scripts/check_no_secrets.py --tree

      # Single-source-of-truth gate: lean-toolchain vs formalization.yaml/README,
      # module inventory (imported + audited + locked + registered), stale-claim
      # blacklist and repository-internal link integrity.  Cheap, no Lean needed.
      - name: SSOT gate
        run: python3 scripts/verify_ssot.py

      # LaTeX source & BibTeX quality gate.  Cheap, no TeX toolchain needed.
      - name: LaTeX source & BibTeX gate
        run: |
          python3 scripts/check_latex.py --source
          python3 scripts/verify_refs.py --offline
