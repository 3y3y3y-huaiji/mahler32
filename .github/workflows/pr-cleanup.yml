name: PR branch cleanup

# After a same-repository pull request is merged, delete its (already merged)
# head branch.  Forks are skipped: their refs do not exist in this repository.
# `main` and `master` are never touched.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    name: Delete merged head branch
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete head branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const protectedBranches = new Set(['main', 'master']);
            if (protectedBranches.has(branch)) {
              core.info(`refusing to delete protected branch ${branch}`);
              return;
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`deleted merged branch ${branch}`);
            } catch (error) {
              // 404/422: the branch was already removed (or never existed here).
              if (error.status !== 404 && error.status !== 422) {
                throw error;
              }
              core.info(`branch ${branch} already absent (${error.status})`);
            }
